source_policy:
  authority_order:
    - official-doc
    - gallery
    - ui-kit
    - fluent-supplement
  rules:
    - Runtime behavior is governed by current Windows and WinUI documentation.
    - Gallery evidence is scoped to the pinned commit and is not automatically normative.
    - UI-kit evidence describes visual composition, not runtime behavior.
    - Derived guidance must cite the evidence and state its limits.

